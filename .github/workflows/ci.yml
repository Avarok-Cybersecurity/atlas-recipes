# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Required checks are deliberately NOT path-filtered on pull_request: a
# path-filtered required check never reports on a PR that does not touch its
# paths, and the PR then waits forever for a check that will never run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every vendored recipe is parsed and rendered here, which is what gives
      # recipe-only pull requests a real check rather than a wasted one.
      - run: cargo test --workspace --locked

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  version-sync:
    name: workspace dep versions match their packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every path dependency's version tracks the package it points at
        run: |
          set -euo pipefail
          # Workspace members depend on each other by path *and* version.
          # Publishing to crates.io needs the version; nothing keeps it in step
          # with the package it names.
          #
          # A stale requirement is invisible while both are 0.1.x, because
          # `^0.1.1` resolves against 0.1.3 quite happily. It only bites when a
          # release cuts a minor bump: `^0.1.1` means `>=0.1.1, <0.2.0`, so
          # 0.2.0 cannot satisfy it and the release job dies with
          #   error: failed to select a version for the requirement
          # *after* the release PR is open and looking healthy. That blocked
          # every release attempt on 2026-08-26.
          #
          # release-please rewrites these by searching for the current version
          # string, so a stale one is skipped rather than corrected — which is
          # why this is checked at build time, where it is still cheap.
          #
          # Every path dependency is checked, not a named few: fixing only the
          # one that happened to fail first leaves the next release to discover
          # the rest.
          fail=0
          while IFS= read -r line; do
            name=${line%% =*}
            path=$(sed -E 's/.*path = "([^"]+)".*/\1/' <<<"$line")
            want=$(sed -E 's/.*version = "([^"]+)".*/\1/' <<<"$line")
            manifest="${path%/}/Cargo.toml"
            have=$(awk '/^\[package\]/{p=1} p && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' "$manifest")
            if [ "$want" != "$have" ]; then
              echo "::error::$name is required at \"$want\" but $manifest is $have"
              fail=1
            else
              echo "ok   $name $want"
            fi
          done < <(grep -E '^[a-z0-9-]+ = \{ path = "[^"]+", version = "[^"]+" \}' Cargo.toml)
          # Same drift, second place it hides. release-please computes the next
          # version from its manifest, not from the manifests on disk, so a
          # stale entry there silently gives one crate a different bump from
          # the rest — atlasctl-protocol sat at 0.1.1 while its Cargo.toml said
          # 0.1.3, and the release proposed 0.2.0 for it and 0.1.4 for
          # everything else. linked-versions cannot correct that; it is working
          # from the wrong starting point.
          python3 - <<'PY'
          import json, pathlib, re, sys
          man = json.loads(pathlib.Path('.release-please-manifest.json').read_text())
          bad = 0
          for path, recorded in man.items():
              f = pathlib.Path('Cargo.toml') if path == '.' else pathlib.Path(path) / 'Cargo.toml'
              m = re.search(r'^\[package\][\s\S]*?^version = "([^"]+)"', f.read_text(), re.M)
              actual = m.group(1) if m else None
              if actual != recorded:
                  print(f"::error::.release-please-manifest.json says {path} is {recorded}, but {f} is {actual}")
                  bad = 1
              else:
                  print(f"ok   manifest {path} {recorded}")
          sys.exit(bad)
          PY

          [ "$fail" = 0 ] || {
            echo "::error::Set each requirement equal to its package version, or the next minor release will fail to resolve."
            exit 1
          }
          echo "all workspace dependency and manifest versions in sync"

  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every source file carries an SPDX header
        run: |
          missing=$(git ls-files '*.rs' '*.sh' '*.yml' '*.py' \
            | while read -r f; do
                head -3 "$f" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only' || echo "$f"
              done)
          if [ -n "$missing" ]; then
            echo "missing SPDX header:"; echo "$missing"; exit 1
          fi

  vendor-neutrality:
    name: vendor neutrality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Atlas targets NVIDIA today and AMD is in bring-up. Accelerator and
      # fabric specifics belong in a provider implementation; anywhere else they
      # erode the abstraction one convenience branch at a time. Tests may name
      # them freely — asserting that AMD emits /dev/kfd is the point.
      - name: No vendor literals outside provider modules
        run: |
          set -eu
          # File list comes from git, not a shell glob: a glob that fails to
          # expand would make this check pass without inspecting anything.
          # `git ls-files` skips untracked files, which is fine in CI (the tree
          # is committed) but silently under-scans when run locally. `find` does
          # not, so the local and CI runs agree.
          #
          # Provider modules are where vendor specifics belong: profile.rs
          # (device flags), collective.rs (fabric env), telemetry/nvidia.rs and
          # telemetry/rocm.rs (per-vendor readings).
          files=$(find crates/*/src -name '*.rs' \
            | grep -vE '(profile|collective)\.rs' \
            | grep -vE 'telemetry/(nvidia|rocm)\.rs' \
            | grep -vE 'tests\.rs|/tests/')
          [ -n "$files" ] || { echo "no files to scan - the lint is not working"; exit 1; }
          echo "scanning $(echo "$files" | wc -l) files"
          # Comments are excluded: the point is to keep vendor *behaviour* out
          # of neutral modules, not to ban the word from prose explaining why
          # the abstraction exists. A doc comment saying nvidia-smi reports N/A
          # on unified-memory parts is exactly the note a reader wants.
          # shellcheck disable=SC2086
          hits=$(grep -nE -- '--gpus|/dev/kfd|/dev/dri|nvidia-smi|rocm-smi|NCCL_' $files \
            | grep -vE ':[0-9]+: *(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "vendor-specific literals outside a provider module:"; echo "$hits"; exit 1
          fi
          echo "clean"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
