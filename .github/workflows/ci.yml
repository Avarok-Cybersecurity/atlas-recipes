# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Required checks are deliberately NOT path-filtered on pull_request: a
# path-filtered required check never reports on a PR that does not touch its
# paths, and the PR then waits forever for a check that will never run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every vendored recipe is parsed and rendered here, which is what gives
      # recipe-only pull requests a real check rather than a wasted one.
      - run: cargo test --workspace --locked

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  version-sync:
    name: internal version requirements match their packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-version-sync.py

  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Every source file carries an SPDX header
        run: |
          missing=$(git ls-files '*.rs' '*.sh' '*.yml' '*.py' \
            | while read -r f; do
                head -3 "$f" | grep -q 'SPDX-License-Identifier: AGPL-3.0-only' || echo "$f"
              done)
          if [ -n "$missing" ]; then
            echo "missing SPDX header:"; echo "$missing"; exit 1
          fi

  vendor-neutrality:
    name: vendor neutrality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Atlas targets NVIDIA today and AMD is in bring-up. Accelerator and
      # fabric specifics belong in a provider implementation; anywhere else they
      # erode the abstraction one convenience branch at a time. Tests may name
      # them freely — asserting that AMD emits /dev/kfd is the point.
      - name: No vendor literals outside provider modules
        run: |
          set -eu
          # File list comes from git, not a shell glob: a glob that fails to
          # expand would make this check pass without inspecting anything.
          # `git ls-files` skips untracked files, which is fine in CI (the tree
          # is committed) but silently under-scans when run locally. `find` does
          # not, so the local and CI runs agree.
          #
          # Provider modules are where vendor specifics belong: profile.rs
          # (device flags), collective.rs (fabric env), telemetry/nvidia.rs and
          # telemetry/rocm.rs (per-vendor readings).
          files=$(find crates/*/src -name '*.rs' \
            | grep -vE '(profile|collective)\.rs' \
            | grep -vE 'telemetry/(nvidia|rocm)\.rs' \
            | grep -vE 'tests\.rs|/tests/')
          [ -n "$files" ] || { echo "no files to scan - the lint is not working"; exit 1; }
          echo "scanning $(echo "$files" | wc -l) files"
          # Comments are excluded: the point is to keep vendor *behaviour* out
          # of neutral modules, not to ban the word from prose explaining why
          # the abstraction exists. A doc comment saying nvidia-smi reports N/A
          # on unified-memory parts is exactly the note a reader wants.
          # shellcheck disable=SC2086
          hits=$(grep -nE -- '--gpus|/dev/kfd|/dev/dri|nvidia-smi|rocm-smi|NCCL_' $files \
            | grep -vE ':[0-9]+: *(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "vendor-specific literals outside a provider module:"; echo "$hits"; exit 1
          fi
          echo "clean"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh scripts/tests/*.sh
      # install.sh is the most-executed thing this project ships and the only
      # one that runs on a machine before any of our code is trusted. shellcheck
      # says it parses; this says it DECIDES correctly — which target, whether a
      # downloaded binary may be executed, and what to do about an agent that
      # may or may not already be there.
      - name: install.sh behaviour
        run: bash scripts/tests/install-sh.test.sh
