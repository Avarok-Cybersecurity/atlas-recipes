# SPDX-License-Identifier: AGPL-3.0-only
#
# Supply-chain policy. This project exists because a dependency's upstream was
# used against its users, so the bans below are load-bearing rather than
# stylistic.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Keeping OpenSSL out is what makes a static musl build possible, which is what
# makes the single-binary install work with no runtime dependencies.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
