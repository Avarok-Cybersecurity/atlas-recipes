# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "atlasctl-agent"
description = "Local agent that lets the Atlas website launch recipes on this machine."
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
atlasctl-core.workspace = true
atlasctl-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
subtle = "2"
thiserror.workspace = true
ed25519-dalek = { version = "3", default-features = false, features = ["pkcs8", "alloc"] }
sha2.workspace = true
hex = "0.4"
zeroize = "1"
getrandom = "0.3"
mdns-sd = { version = "0.21", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "ring"] }
spake2 = "0.4"
rustls-pki-types = "1.15.1"
libc = "0.2"

[dev-dependencies]
# The recording mocks are feature-gated so they never ship in a release build.
atlasctl-core = { workspace = true, features = ["test-mocks"] }

[features]
test-mocks = []

[lints]
workspace = true
